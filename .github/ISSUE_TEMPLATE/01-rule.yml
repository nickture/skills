name: Mistake or dispute in a rule
description: A rule is wrong, imprecise or open to dispute
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - nickture-interface
        - nickture-text-ru
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule heading
      description: As written in the file, for example «Дай нажать»
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: An example screen or text where the rule gets it wrong
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What it should be
      description: New wording or a source, if you have them
