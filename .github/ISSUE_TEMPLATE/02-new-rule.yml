name: New rule
description: A rule the skills don't have yet
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - nickture-interface
        - nickture-text-ru
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Rule
      description: Heading, statement, why it holds, example
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A book, article or catalog, if the idea isn't yours
