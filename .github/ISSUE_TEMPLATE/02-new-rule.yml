name: Новое правило
description: Правило, которого в скиллах ещё нет
body:
  - type: dropdown
    id: skill
    attributes:
      label: Скилл
      options:
        - nickture-interface
        - nickture-text-ru
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Правило
      description: Заголовок, утверждение, почему оно верно, пример
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Источник
      description: Книга, статья или каталог, если мысль не ваша
