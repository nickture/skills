name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history, so git can check that the release branch moves forward
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the release from its CHANGELOG.md section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          awk -v h="## $v " 'index($0, h) == 1 {p=1; next} /^## /{p=0} p' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          test -s notes.md || { echo "No section for $v in CHANGELOG.md"; exit 1; }
          gh release create "$TAG" --title "$v" --notes-file notes.md --verify-tag
      # Anthropic's directory tracks the release branch, so it sees only releases.
      # The branch gets the tag's files without CLAUDE.md, AGENTS.md and .github/:
      # they serve the repository, and the directory's checks read them as the plugin.
      # Each release commit sits on the previous one, and an older tag is refused
      - name: Put the tag's files on the release branch
        env:
          TAG: ${{ github.ref_name }}
          GIT_INDEX_FILE: ${{ runner.temp }}/release-index
        run: |
          v=${TAG#v}
          old=$(git show origin/release:.claude-plugin/plugin.json | sed -n 's/^  "version": "\(.*\)",$/\1/p')
          test "$(printf '%s\n' "$old" "$v" | sort -V | tail -1)" = "$v" || { echo "release has $old, newer than $v"; exit 1; }
          git ls-tree -r HEAD | awk -F'\t' '$2 !~ /^(CLAUDE\.md$|AGENTS\.md$|\.github\/)/' | git update-index --add --index-info
          c=$(git -c user.name='github-actions[bot]' -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
                commit-tree "$(git write-tree)" -p origin/release -m "Release $v")
          git push origin "$c:refs/heads/release"
